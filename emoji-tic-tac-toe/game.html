<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emoji Tic-Tac-Toe</title>
    <link rel="stylesheet" href="../shared/common-ui.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="game-container">
        <!-- Splash Screen -->
        <div id="splash-screen">
            <div id="splash-decor">💖🅾️❌</div>
            <h1>Emoji Tic-Tac-Toe</h1>
            <p id="splash-instructions">Get three in a row to win! 🤩</p>
            <button id="start-game-btn" class="game-button game-button-primary green">Start Game</button>
        </div>

        <!-- Main Game Interface (Initially Hidden) -->
        <div id="main-game-interface">
            <h2 id="game-status">Player ❌'s Turn</h2>
            
            <div id="tic-tac-toe-board">
                <!-- Cells will be generated by JavaScript -->
            </div>

            <div id="game-controls">
                <button id="restart-game-btn" class="game-button pink">Restart</button>
                <button id="pause-game-btn" class="game-button game-button-secondary orange">Pause</button>
                <a href="../index.html" class="game-button game-button-secondary home-button">🏠 Game World</a>
                <button id="exit-game-btn" class="game-button game-button-secondary grey">Exit Game</button>
            </div>
        </div>

        <!-- Pause Overlay (Initially Hidden) -->
        <div id="pause-overlay" class="game-screen-overlay"> <!-- Already has the class, good. -->
            <h2>Paused</h2>
            <button id="resume-game-btn" class="game-button game-button-primary green">Resume</button>
        </div>

    </div>

    <script src="../shared/ui-manager.js" defer></script>
    <script src="script.js" defer></script>
</body>
</html>
